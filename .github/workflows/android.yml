name: Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.7 --distribution-type bin
          chmod +x gradlew

      - name: Create placeholder stockfish asset
        run: |
          mkdir -p app/src/main/assets
          if [ ! -f app/src/main/assets/stockfish ]; then
            printf '#!/system/bin/sh\necho "placeholder - replace with real stockfish arm64 binary"\n' > app/src/main/assets/stockfish
          fi

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: opencheps-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
